name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job reads the repository and nothing else, so it is handed a token that
# can do nothing else either.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. The live suite is opt-in: both sites serve everyone
      # free of charge, and shared runners have no business adding load to them
      # on every push. The nightly canary is where the real routes are
      # exercised.
      - run: npm test
      - run: npm run build
