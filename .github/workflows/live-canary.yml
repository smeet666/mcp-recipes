# Nightly canary against the two real sites.
#
# The unit tests run against stand-in sites, so they cannot detect that Marmiton
# changed the markup of a recipe page or that the Wikimedia gateway renamed a
# field: the day either happens, they stay green while the published server is
# broken for everyone. This job is the only thing that notices, and it opens an
# issue when it fails.
#
# It is deliberately separate from CI: it depends on third-party services, so a
# failure here means "a site moved", never "this pull request is bad".

name: Live canary

on:
  schedule:
    # 03:21 UTC, off the hour and clear of the other scheduled jobs.
    - cron: "21 3 * * *"
  workflow_dispatch:

# A single run at a time, so a slow night cannot overlap with the next one.
concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to open the issue that reports a broken contract.
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the live canary
        env:
          RECIPES_LIVE: "1"
          # Slower than the default: a scheduled job has no user waiting, and
          # both sites serve everyone for free.
          RECIPES_MIN_INTERVAL_MS: "3000"
          # Generous: a canary must fail on a changed contract, not on a slow night.
          RECIPES_TIMEOUT_MS: "60000"
          RECIPES_LOG_LEVEL: info
        run: npm run test:live

      - name: Report a broken canary
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Live canary failing: one of the two sites may have changed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly live canary failed. Either Marmiton or the Wikibooks Cookbook changed",
              "something this server reads, or one of them was unreachable from the runner.",
              "",
              `Run: ${runUrl}`,
              "",
              "The assertion messages name the site and the behaviour that moved. The reading of each",
              "site lives in its own published client, so a parsing fix usually means releasing that",
              "client and raising the version this server depends on, rather than editing anything here.",
              "",
              "Two assertions deserve particular attention. One checks that a recipe neither site holds",
              "still comes back as an absence carrying a code, rather than as an empty recipe, which is",
              "the rule the whole server is built on. The other checks that the Cookbook's licence is",
              "still attached to what it publishes, because repeating that text without it is a licence",
              "breach rather than a missing field.",
              "",
              "A failure on one site alone is worth reading closely: the merged answer is supposed to",
              "survive it and say which site was missing, so a canary that goes red on both assertions",
              "at once is a different problem from one that goes red on one.",
            ].join("\n");

            // Reuse the open issue rather than filing one every night.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-canary",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString()}. ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-canary"],
              });
            }
