# Nightly canary against the real sites.
#
# The unit tests run against stand-in sites, so they cannot detect that one of
# them changed the markup of a recipe page or that the Wikimedia gateway renamed
# a field: the day that happens, they stay green while the published server is
# broken for everyone. This job is the only thing that notices, and it opens an
# issue when it fails.
#
# It is deliberately separate from CI: it depends on third-party services, so a
# failure here means "a site moved", never "this pull request is bad".

name: Live canary

on:
  schedule:
    # 03:21 UTC, off the hour and clear of the other scheduled jobs.
    - cron: "21 3 * * *"
  workflow_dispatch:

# A single run at a time, so a slow night cannot overlap with the next one.
concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to open the issue that reports a broken contract.
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Run the live canary
        env:
          RECIPES_LIVE: "1"
          # Slower than the default: a scheduled job has no user waiting, and
          # both sites serve everyone for free.
          RECIPES_MIN_INTERVAL_MS: "3000"
          # Generous: a canary must fail on a changed contract, not on a slow night.
          RECIPES_TIMEOUT_MS: "60000"
          RECIPES_LOG_LEVEL: info
        run: npm run test:live

      - name: Close the report when the routes answer again
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            // An open report says the routes are failing. Left open after they
            // answer again, it says that of a night that has passed, and the
            // next failure lands as a comment on a thread nobody reopens.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-canary",
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The routes answered again as of ${new Date().toISOString()}. ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Report a broken canary
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Live canary failing: one of the sites may have changed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly live canary failed. One of the sites this server reads changed something",
              "it reads, or was unreachable from the runner.",
              "",
              `Run: ${runUrl}`,
              "",
              "The assertion messages name the site and the behaviour that moved. The reading of each",
              "site lives in its own published client, so a parsing fix usually means releasing that",
              "client and raising the version this server depends on, rather than editing anything here.",
              "",
              "Two assertions deserve particular attention. One checks that a recipe neither site holds",
              "still comes back as an absence carrying a code, rather than as an empty recipe, which is",
              "the rule the whole server is built on. The other checks that the Cookbook's licence is",
              "still attached to what it publishes, because repeating that text without it is a licence",
              "breach rather than a missing field.",
              "",
              "A failure on one site alone is worth reading closely: the merged answer is supposed to",
              "survive it and say which site was missing. A canary red on one site is a site that",
              "moved; red on every one of them is this server, or the runner's network.",
            ].join("\n");

            // Reuse the open issue rather than filing one every night.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-canary",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString()}. ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-canary"],
              });
            }
